# Design-token drift guard (FER-131 handoff · 01).
#
# `Instrumento.swift` is the single source of truth for the «Instrumento diurno» tokens. This job
# re-runs the generator (`swift run StrandDesignTokens`) and fails if the committed doc artifacts
# (docs/design-system/DESIGN.md token table + tokens/design-tokens.json) differ from what the code
# produces — i.e. someone changed a token without regenerating, or hand-edited the generated blocks.
# Self-contained: plain SwiftPM on macOS, no Xcode, no signing, no secrets.
#
# Billing note (jul-2026): macOS minutes bill at 10× and every run rounds up to ≥1 min, so this
# workflow was burning ~150 billable min/day. Mitigations, same coverage:
#   - The Python screen linter moved to design-lint.yml (ubuntu, 1×) with the broad Cenit/** paths;
#     this macOS job only fires when the token source or its generated artifacts can actually drift.
#   - `pull_request` only — the push to iOS is the squash of an already-checked PR.
name: Design Tokens

on:
  pull_request:
    branches: [iOS, main]
    paths:
      - 'Packages/StrandDesign/**'
      - 'docs/design-system/DESIGN.md'
      - 'docs/design-system/tokens/design-tokens.json'
      - '.github/workflows/design-tokens.yml'
  workflow_dispatch:

concurrency:
  group: design-tokens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    # macos-26 ships Xcode 26+ (iOS 26 SDK, needed for glassEffect) — same reasoning as ios-app.yml.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: StrandDesign tests (snapshots + contrast + token anchors)
        run: swift test
        working-directory: Packages/StrandDesign

      - name: Regenerate tokens from Instrumento.swift
        run: swift run StrandDesignTokens
        working-directory: Packages/StrandDesign

      - name: Fail if docs drift from code
        run: |
          if ! git diff --exit-code -- docs/design-system/DESIGN.md docs/design-system/tokens/design-tokens.json; then
            echo "::error::Design tokens are out of date. Run 'swift run StrandDesignTokens' in Packages/StrandDesign and commit the result."
            exit 1
          fi
