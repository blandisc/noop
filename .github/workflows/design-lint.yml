# Screen-level design-drift linter (auditoría jul-2026), split out of design-tokens.yml so it
# runs on ubuntu (1× billing) instead of macOS (10×) — it's pure Python, no Swift toolchain needed.
#
# Rules activate incrementally as each migration lands. `no-hex` runs on every root (all hex
# lives in StrandDesign). The font/radius/opacity rules are now ON for the migrated surfaces —
# `Cenit/Screens` + `Cenit/Onboarding` are fully token-clean (tasks 01/02/03). CenitWidgets
# (Live Activity) and CenitWatch are fixed Dynamic-Island / watch geometry (the WidgetMetrics
# category, exempt from Dynamic Type) and are intentionally not yet under the 3 new rules.
#
# `no-spacing-literal` (FER-258) runs over Cenit/Screens as a RATCHET against
# Tools/design-drift-baseline.json: the 466 literals the tree still carries are grandfathered per file,
# one more fails. It extends to CenitWidgets/CenitWatch only when FER-219 closes — their fixed
# Dynamic-Island / watch geometry is exempt on purpose.
name: Design Lint

on:
  pull_request:
    branches: [iOS, main]
    paths:
      - 'Packages/StrandDesign/**'
      - 'Cenit/**'
      - 'CenitWidgets/**'
      - 'CenitWatch/**'
      - 'Tools/check-design-drift.py'
      - 'Tools/check-baseline-monotony.py'
      - 'Tools/design-drift-baseline.json'
      - 'Tools/tests/**'
      - '.github/workflows/design-lint.yml'
  workflow_dispatch:

concurrency:
  group: design-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Design-drift linter — no raw hex (all roots)
        run: python3 Tools/check-design-drift.py --rules no-hex
      - name: Design-drift linter — no ad-hoc font/radius/opacity (migrated screens)
        run: python3 Tools/check-design-drift.py --rules no-adhoc-font,no-radius-literal,no-opacity-literal Cenit/Screens Cenit/Onboarding
      - name: Design-drift linter — no em-dash in copy (FER-879, app-wide)
        run: python3 Tools/check-design-drift.py --rules no-emdash-string Cenit/Screens Cenit/Onboarding
      - name: Design-drift linter — no raw shadow, use StrandElevation (migrated screens)
        run: python3 Tools/check-design-drift.py --rules no-raw-shadow Cenit/Screens
      - name: Linter self-tests (FER-263/264)
        run: python3 -m unittest discover -s Tools/tests -p 'test_*.py'
      - name: Design-drift linter — no spacing/stroke literal, ratchet (FER-258/263)
        run: python3 Tools/check-design-drift.py --rules no-spacing-literal --baseline Tools/design-drift-baseline.json Cenit/Screens Cenit/Onboarding Cenit/System Cenit/App
      - name: Design-drift linter — no legacy API, ratchet (FER-263)
        run: python3 Tools/check-design-drift.py --rules no-legacy-api --baseline Tools/design-drift-baseline.json Cenit/Screens Cenit/Onboarding Cenit/System Cenit/App Cenit/Data Cenit/LiveActivity Cenit/Media
      - name: Design-drift linter — token-exempt es deuda, ratchet (FER-263)
        run: python3 Tools/check-design-drift.py --rules token-exempt --baseline Tools/design-drift-baseline.json Cenit/Screens Cenit/Onboarding Cenit/System Cenit/App Cenit/Data Cenit/LiveActivity Cenit/Media Packages/StrandDesign/Sources
      - name: Sin vidrio dentro de una hoja (papel opaco)
        run: python3 Tools/check-design-drift.py --rules no-sheet-glass Packages/StrandDesign/Sources Cenit CenitApp CenitShared CenitWidgets

  # FER-264 (épico FER-261): el baseline SOLO puede bajar. Compara el JSON del PR contra el de la
  # base real del PR; cualquier conteo que sube falla. Alta legal ÚNICA: PR dedicado solo-baseline
  # (+docs) con la label `baseline-alta` que aplica el dueño — ambas condiciones las verifica el
  # script, así un PR con código jamás puede bendecirse solo. Ver docs/design-system/CONTRATO.md.
  baseline-monotony:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Baseline de la base del PR
        run: |
          git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}
          git show ${{ github.event.pull_request.base.sha }}:Tools/design-drift-baseline.json > /tmp/base.json || echo '{}' > /tmp/base.json
      - name: El baseline solo baja
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # diff de dos puntos (no tres): el checkout es shallow y HEAD ya es el merge del PR sobre la base
          DIFF_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD | tr '\n' ',')
          python3 Tools/check-baseline-monotony.py /tmp/base.json Tools/design-drift-baseline.json \
            --labels "$PR_LABELS" --diff-files "$DIFF_FILES"
