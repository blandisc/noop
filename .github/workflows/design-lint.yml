# Screen-level design-drift linter (auditoría jul-2026), split out of design-tokens.yml so it
# runs on ubuntu (1× billing) instead of macOS (10×) — it's pure Python, no Swift toolchain needed.
#
# Rules activate incrementally as each migration lands. `no-hex` runs on every root (all hex
# lives in StrandDesign). The font/radius/opacity rules are now ON for the migrated surfaces —
# `Cenit/Screens` + `Cenit/Onboarding` are fully token-clean (tasks 01/02/03). CenitWidgets
# (Live Activity) and CenitWatch are fixed Dynamic-Island / watch geometry (the WidgetMetrics
# category, exempt from Dynamic Type) and are intentionally not yet under the 3 new rules.
#
# `no-spacing-literal` (FER-258) runs over Cenit/Screens as a RATCHET against
# Tools/design-drift-baseline.json: the 466 literals the tree still carries are grandfathered per file,
# one more fails. It extends to CenitWidgets/CenitWatch only when FER-219 closes — their fixed
# Dynamic-Island / watch geometry is exempt on purpose.
name: Design Lint

# Sin filtro de paths desde FER-261: el workflow cuesta ~13 s en ubuntu y correrlo SIEMPRE es lo
# que permite volver `lint` y `baseline-monotony` required checks de iOS sin dejar inmergeables
# los PRs que no tocan diseño (un required check que no reporta bloquea el merge para siempre).
on:
  pull_request:
    branches: [iOS, main]
    # labeled/unlabeled: el alta legal (`baseline-alta`) se aplica DESPUÉS de abrir el PR —
    # sin estos types el job de monotonía se quedaría en rojo hasta un push vacío (Grok r1 #5).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: design-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Paridad de las tres patas contra CONTRATO.md (FER-265)
        run: python3 Tools/check-gate-parity.py
      - name: Design-drift linter — no raw hex (all roots)
        run: python3 Tools/check-design-drift.py --rules no-hex
      - name: Design-drift linter — no ad-hoc font/radius/opacity, ratchet (FER-276)
        run: python3 Tools/check-design-drift.py --rules no-adhoc-font,no-radius-literal,no-opacity-literal --baseline Tools/design-drift-baseline.json Cenit/Screens Cenit/Onboarding Cenit/System Cenit/App CenitApp
      - name: Design-drift linter — anti-evasión del colador, ratchet (FER-276)
        run: python3 Tools/check-design-drift.py --rules no-raw-color,no-edgeinsets-literal,no-token-arithmetic --baseline Tools/design-drift-baseline.json Cenit/Screens Cenit/Onboarding Cenit/System Cenit/App Cenit/Data Cenit/LiveActivity Cenit/Media CenitApp
      - name: Design-drift linter — no em-dash in copy (FER-879, app-wide)
        run: python3 Tools/check-design-drift.py --rules no-emdash-string Cenit/Screens Cenit/Onboarding
      - name: Design-drift linter — no raw shadow, use StrandElevation (migrated screens)
        run: python3 Tools/check-design-drift.py --rules no-raw-shadow Cenit/Screens
      - name: Linter self-tests (FER-263/264/265)
        run: python3 -m unittest discover -s Tools/tests -p 'test_*.py'
      - name: Design-drift linter — no spacing/stroke literal, ratchet (FER-258/263)
        run: python3 Tools/check-design-drift.py --rules no-spacing-literal --baseline Tools/design-drift-baseline.json Cenit/Screens Cenit/Onboarding Cenit/System Cenit/App CenitApp
      - name: Design-drift linter — no motion literal, ratchet (FER-269)
        run: python3 Tools/check-design-drift.py --rules no-motion-literal --baseline Tools/design-drift-baseline.json Cenit/Screens Cenit/Onboarding Cenit/System Cenit/App CenitApp
      - name: Oráculo de Dynamic Type — solo el cap bendecido (FER-269/FER-118)
        run: python3 Tools/check-design-drift.py --rules no-dt-cap-adhoc Cenit/Screens Cenit/Onboarding Cenit/System Cenit/App Cenit/Data Cenit/LiveActivity Cenit/Media CenitWidgets CenitWatch CenitApp
      - name: Design-drift linter — no legacy API, ratchet (FER-263)
        run: python3 Tools/check-design-drift.py --rules no-legacy-api --baseline Tools/design-drift-baseline.json Cenit/Screens Cenit/Onboarding Cenit/System Cenit/App Cenit/Data Cenit/LiveActivity Cenit/Media CenitApp
      - name: Design drift · no-deprecated-metrics + no-instrumento-theme (FER-306)
        run: python3 Tools/check-design-drift.py --rules no-deprecated-metrics,no-instrumento-theme --baseline Tools/design-drift-baseline.json Cenit/Screens Cenit/Onboarding Cenit/System Cenit/App Cenit/Data Cenit/LiveActivity Cenit/Media CenitApp
      - name: Design-drift linter — token-exempt es deuda, ratchet (FER-263)
        run: python3 Tools/check-design-drift.py --rules token-exempt --baseline Tools/design-drift-baseline.json Cenit/Screens Cenit/Onboarding Cenit/System Cenit/App Cenit/Data Cenit/LiveActivity Cenit/Media Packages/StrandDesign/Sources CenitApp
      - name: Sin vidrio dentro de una hoja (papel opaco)
        run: python3 Tools/check-design-drift.py --rules no-sheet-glass Packages/StrandDesign/Sources Cenit CenitApp CenitShared CenitWidgets

  # FER-264 (épico FER-261): el baseline SOLO puede bajar. Compara el JSON del PR contra el de la
  # base real del PR; cualquier conteo que sube falla. Alta legal ÚNICA: PR dedicado solo-baseline
  # (+docs) con la label `baseline-alta` que aplica el dueño — ambas condiciones las verifica el
  # script, así un PR con código jamás puede bendecirse solo. Ver docs/design-system/CONTRATO.md.
  baseline-monotony:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Baseline y guardia de la base del PR
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # La punta ACTUAL de la rama base vía FETCH_HEAD — no base.sha (foto stale al abrirse el
          # PR) y no origin/$BASE_REF (checkout@v4 restringe el refspec y ese ref NO se crea: el
          # primer intento falló en silencio y el job aprobó con base vacía + guardián del PR — el
          # hoyo exacto que este job existe para cerrar). Sin fallbacks: si algo falla, FALLA.
          git fetch --depth=1 origin "$BASE_REF"
          git show "FETCH_HEAD:Tools/design-drift-baseline.json" > /tmp/base.json
          # El guardia se ejecuta desde la BASE, no desde el PR: un PR no puede traer su propio
          # check-baseline-monotony.py parchado (Grok r1 #2).
          git show "FETCH_HEAD:Tools/check-baseline-monotony.py" > /tmp/check-monotony.py
      - name: El baseline solo baja
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # diff de dos puntos (no tres): el checkout es shallow y HEAD ya es el merge del PR
          # sobre la punta ACTUAL de la base — misma referencia (FETCH_HEAD) que el guardia.
          DIFF_FILES=$(git diff --name-only FETCH_HEAD HEAD | tr '\n' ',')
          python3 /tmp/check-monotony.py /tmp/base.json Tools/design-drift-baseline.json \
            --labels "$PR_LABELS" --diff-files "$DIFF_FILES"
