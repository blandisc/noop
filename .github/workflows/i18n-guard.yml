# Guards the localized surface (FER-472 · ampliado FER-audit). Tres chequeos, Python-only,
# sin Xcode ni secretos:
#   1. hardcoded-strings — un literal en español colado como clave (Tools/check-hardcoded-strings.py).
#   2. es-emdash — guion largo en un valor ESPAÑOL del catálogo (el punto ciego: design-lint solo
#      mira .swift, no el catálogo, así que el copy es-MX que ve el usuario se colaba).
#   3. missing-es — una clave NUEVA sin traducción es-MX (con línea base para las heredadas).
name: i18n guard

on:
  pull_request:
    paths:
      - 'Cenit/Screens/**'
      - 'Cenit/Resources/Localizable.xcstrings'
      - 'Packages/StrandDesign/Sources/StrandDesign/FiveRules.swift'
      - 'Tools/check-hardcoded-strings.py'
      - 'Tools/check-xcstrings-emdash.py'
      - 'Tools/check-xcstrings-es.py'
      - 'Tools/i18n-es-baseline.txt'
      - '.github/workflows/i18n-guard.yml'
  push:
    paths:
      - 'Cenit/Screens/**'
      - 'Cenit/Resources/Localizable.xcstrings'
      - 'Packages/StrandDesign/Sources/StrandDesign/FiveRules.swift'
      - 'Tools/check-hardcoded-strings.py'
      - 'Tools/check-xcstrings-emdash.py'
      - 'Tools/check-xcstrings-es.py'
      - 'Tools/i18n-es-baseline.txt'
      - '.github/workflows/i18n-guard.yml'
  workflow_dispatch:

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hardcoded non-English UI strings
        run: python3 Tools/check-hardcoded-strings.py
      - name: Em-dash in Spanish catalog copy
        run: python3 Tools/check-xcstrings-emdash.py
      - name: New keys missing an es translation
        run: python3 Tools/check-xcstrings-es.py
