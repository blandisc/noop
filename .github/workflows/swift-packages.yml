# Compile-and-test verification for the reusable Swift packages.
#
# This job intentionally does NOT touch the iOS app target: that build needs
# XcodeGen to generate the Xcode project and a wired-up scheme, and runs on the
# iOS simulator. The packages, by contrast, build
# and test on their own with plain SwiftPM — no Xcode project, no signing, no
# secrets — which makes them a safe, self-contained CI check that leaks nothing.
name: Swift Packages CI

on:
  pull_request:
    branches: [iOS, main]
    paths:
      - 'Packages/**'
      - '.github/workflows/swift-packages.yml'
  push:
    branches: [iOS, main]
    paths:
      - 'Packages/**'
      - '.github/workflows/swift-packages.yml'
  workflow_dispatch:

concurrency:
  group: swift-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pure-logic packages run on ubuntu (1× billing / faster queue); only StrandDesign
    # needs macOS because it imports SwiftUI/Charts/UIKit/AppKit, which don't exist on
    # Linux. The other five import no Apple UI/BLE frameworks, so plain SwiftPM builds
    # and tests them on Linux with identical coverage.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: WhoopProtocol
            os: ubuntu-latest
          - package: WhoopStore
            os: ubuntu-latest
          - package: StrandAnalytics
            os: ubuntu-latest
          - package: StrandImport
            os: ubuntu-latest
          - package: StrandTraining
            os: ubuntu-latest
          - package: StrandDesign
            os: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.package }}
        run: swift build
        working-directory: Packages/${{ matrix.package }}

      - name: Test ${{ matrix.package }}
        run: swift test
        working-directory: Packages/${{ matrix.package }}
