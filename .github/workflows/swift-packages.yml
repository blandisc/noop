# Compile-and-test verification for the reusable Swift packages.
#
# This job intentionally does NOT touch the iOS app target: that build needs
# XcodeGen to generate the Xcode project and a wired-up scheme, and runs on the
# iOS simulator. The packages, by contrast, build
# and test on their own with plain SwiftPM — no Xcode project, no signing, no
# secrets — which makes them a safe, self-contained CI check that leaks nothing.
name: Swift Packages CI

on:
  pull_request:
    branches: [iOS, main]
    paths:
      - 'Packages/**'
      - '.github/workflows/swift-packages.yml'
  push:
    branches: [iOS, main]
    paths:
      - 'Packages/**'
      - '.github/workflows/swift-packages.yml'
  workflow_dispatch:

concurrency:
  group: swift-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Linux-safe packages run on ubuntu (1× billing / faster queue). The rest need macOS
    # because of Apple-only frameworks unavailable on Linux:
    #   - StrandDesign: SwiftUI / Charts / UIKit / AppKit
    #   - CenitStore:   Compression (RawOutbox.swift) — and StrandImport inherits it
    #     (depends on CenitStore, so fails to build on Linux transitively).
    #   - StrandTraining: Compression (Exercise.swift — zlib-inflated catalog, FER-875).
    # Pure / Foundation-only packages build/test on Linux: BiometricStreams,
    # StrandModels, StrandAnalytics (depends on StrandModels + BiometricStreams only — L3-C1b;
    # no longer links GRDB via CenitStore).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: BiometricStreams
            os: ubuntu-latest
          - package: StrandAnalytics
            os: ubuntu-latest
          - package: StrandTraining
            os: macos-15
          - package: CenitStore
            os: macos-15
          - package: StrandImport
            os: macos-15
          - package: StrandDesign
            # macos-26 ships Xcode 26+ (iOS 26 SDK, needed for glassEffect) — same reasoning as ios-app.yml.
            os: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode version
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Build ${{ matrix.package }}
        run: swift build
        working-directory: Packages/${{ matrix.package }}

      - name: Test ${{ matrix.package }}
        run: swift test
        working-directory: Packages/${{ matrix.package }}
