name: iOS App Compile Check

# FER-973 (A-01): the app layer (~75% of the code) had NO mechanical gate — the packages CI only
# watches Packages/**, so a PR touching only Cenit/** could land without any machine compiling it.
# This job compiles the Cenit SCHEME (app + widget/Live-Activity extensions via the scheme's
# dependency graph) unsigned, mirroring release.yaml's recipe.
#
# Deliberately LABEL-GATED (`ci-app`) + manual dispatch, NOT on every PR: macOS runners bill at
# 10× and this account has hit Actions spending limits before (2026-07-11). Apply the `ci-app`
# label to a PR to run it; widening it to every app-touching PR later is a one-line `if:` change.

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci-app')
    # macos-26 ships Xcode 26+ (iOS 26 SDK) — same reasoning as release.yaml.
    runs-on: macos-26
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      # Scheme build (not -target) so the widget and Live Activity extensions compile too.
      # Compile-only check: unsigned, entitlements stripped — green means "compiles cleanly",
      # exactly like release.yaml's build step.
      - name: Compile Unsigned iOS App
        run: |
          xcodebuild build \
            -project Cenit.xcodeproj \
            -scheme Cenit \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ASSETCATALOG_COMPILER_APPICON_NAME=""
