name: iOS App Compile + Unit Tests

# FER-973 (A-01): the app layer (~75% of the code) had NO mechanical gate — the packages CI only
# watches Packages/**, so a PR touching only Cenit/** could land without any machine compiling it.
# This job compiles the Cenit SCHEME (app + widget/Live-Activity extensions via the scheme's
# dependency graph) plus the test targets (see the build step's note on `build-for-testing`).
#
# FER-50: it now also RUNS CenitUnitTests on a simulator. Compiling them was never enough — the
# suite had rotted invisibly (see the build step's note), because no machine anywhere executed it.
# One job does both: the same build feeds the compile gate and the test run, so this costs one
# macOS runner, not two.
#
# Deliberately LABEL-GATED (`ci-app`) + manual dispatch, NOT on every PR: macOS runners bill at
# 10× and this account has hit Actions spending limits before (2026-07-11). Apply the `ci-app`
# label to a PR to run it; widening it to every app-touching PR later is a one-line `if:` change.

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  # Nightly compile gate over iOS (plan de remediación 2026-07-20): the app layer merges by default
  # without any machine compiling it (the label gate went unused through the entire FER-1003 epic —
  # 0% adoption). One scheduled run/day bounds the damage window at ~1 macOS-hour/day billable.
  schedule:
    - cron: '17 7 * * *'   # 07:17 UTC ≈ 01:17 CDMX, machine idle hours
  workflow_dispatch:

# Retro FER-309: el evento `opened` (que se salta el gate) compartía grupo con el `labeled` (el real)
# y lo cancelaba: `--label ci-app` al crear el PR dejaba `compile-check: skipping` sin haber corrido
# (2 veces en FER-309, 1 en FER-299). Separar el grupo por acción; `synchronize` sigue cancelando
# a su propio anterior.
concurrency:
  group: ios-app-${{ github.ref }}-${{ github.event.action || github.event_name }}
  cancel-in-progress: true

jobs:
  compile-check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      contains(github.event.pull_request.labels.*.name, 'ci-app')
    # macos-26 ships Xcode 26+ (iOS 26 SDK) — same reasoning as release.yaml.
    runs-on: macos-26
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      # Scheme build (not -target) so the widget and Live Activity extensions compile too.
      #
      # `build-for-testing`, NOT plain `build`: a plain `build` never compiles CenitUnitTests /
      # CenitUITests, so a stale call site in a test compiles nowhere in CI and only surfaces when a
      # human runs the harness. That happened: FER-954 added a `todayKey:` parameter to
      # `StrainDetailModel.build` and left TrendCurrentDayTests behind, which broke the whole
      # screenshot/UI harness (Tools/update-screen-map.sh, iterate-shot.sh, capture-appmap.sh —
      # `xcodebuild test` builds ALL test targets even under `-only-testing`) while both this job and
      # release.yaml stayed green. `build-for-testing` closes exactly that gap.
      #
      # `build-for-testing` needs a destination that can host tests, so the device SDK
      # (`-sdk iphoneos`) becomes a generic Simulator destination. This step still only COMPILES;
      # the simulator gets booted by the NEXT step, which runs the suite (FER-50).
      #
      # AD-HOC signed, entitlements INTACT — and that is the whole point (FER-49/FER-50).
      #
      # The old recipe here stripped signing AND entitlements (`CODE_SIGN_ENTITLEMENTS=""`). That is
      # fine to COMPILE, but such a build cannot RUN: without the App Group entitlement the app trips
      # `AppGroup.warnIfGroupUnprovisioned`'s simulator assert and the test runner dies before the
      # first test ("Early unexpected exit ... crashed before establishing connection"). That is
      # exactly why `Tools/verify.sh app-tests` was broken for months and why CenitUnitTests rotted
      # unseen: 5 tests from PR #1017 had NEVER executed anywhere, and one of them was hiding a real
      # user-facing bug (the training streak bragged «120 days on plan» with no plan configured).
      #
      # No Apple account is needed: the Simulator does not enforce provisioning, it just applies the
      # entitlements file, so ad-hoc (`CODE_SIGN_IDENTITY="-"`, manual style, no team, no profile) is
      # enough to both compile and run. Verified locally: 230 tests green with this exact recipe.
      # release.yaml still covers the fully unsigned/stripped device build, so that path keeps a gate.
      - name: Compile iOS App + Test Targets (ad-hoc signed)
        run: |
          xcodebuild build-for-testing \
            -project Cenit.xcodeproj \
            -scheme Cenit \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ASSETCATALOG_COMPILER_APPICON_NAME=""

      # The simulator name is resolved from what the runner image actually ships instead of being
      # pinned: a hardcoded «iPhone 17 Pro» turns every Xcode image bump into a red build for a
      # reason that has nothing to do with the code.
      - name: Run CenitUnitTests on the Simulator
        run: |
          sim=$(xcrun simctl list devices available \
                | grep -oE 'iPhone [0-9A-Za-z ]+' | head -1 | sed 's/ *$//')
          [ -n "$sim" ] || { echo "::error::no iPhone simulator available on this runner"; exit 1; }
          echo "Running CenitUnitTests on «$sim»"
          xcodebuild test-without-building \
            -project Cenit.xcodeproj \
            -scheme Cenit \
            -destination "platform=iOS Simulator,name=$sim" \
            -only-testing:CenitUnitTests \
            -resultBundlePath TestResults.xcresult

      # Outside a developer's own Mac this is the only place the suite runs, so when one goes red the
      # bundle is the whole forensic trail.
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CenitUnitTests-results
          path: TestResults.xcresult
          retention-days: 7
