name: Strand
options:
  bundleIdPrefix: com.noopapp
  createIntermediateGroups: true
  groupSortPosition: top
  # Base/development language. The in-source UI strings are authored in English (US);
  # the String Catalog (Strand/Resources/Localizable.xcstrings) carries this as the
  # source language and is where additional languages are added.
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "1.81"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Emit localizable strings so Xcode auto-extracts every LocalizedStringKey into the
    # String Catalog on build (the English (US) base entries).
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: "B7KRCF776Z"
    CODE_SIGN_STYLE: Automatic
    # Standard archs (arm64 on iOS device / simulator).
    ARCHS: "$(ARCHS_STANDARD)"
  configs:
    Release:
      # Release/archive builds every valid arch, not just the host's active one.
      ONLY_ACTIVE_ARCH: NO
packages:
  WhoopProtocol:
    path: Packages/WhoopProtocol
  WhoopStore:
    path: Packages/WhoopStore
  StrandAnalytics:
    path: Packages/StrandAnalytics
  StrandImport:
    path: Packages/StrandImport
  StrandDesign:
    path: Packages/StrandDesign
targets:
  # ---------------------------------------------------------------------------
  # iOS app target. Reuses the five shared packages and almost all of Strand/
  # (the SwiftUI screens, BLE engine, collector, data layer) unchanged; only the
  # macOS-only scene/menu-bar/notification files are excluded, and the iOS-only
  # app shell + HealthKit + widgets/intents live under StrandiOS/.
  NOOPiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Strand
        excludes:
          - "Resources/Info.plist"
          - "Resources/Strand.entitlements"
          - "Resources/Assets.xcassets"
      - path: StrandiOS
        excludes:
          - "Resources/Info.plist"
          - "Resources/NOOP.entitlements"
      - path: StrandiOSShared
    info:
      path: StrandiOS/Resources/Info.plist
      properties:
        CFBundleName: Cénit
        CFBundleDisplayName: Cénit
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        # Derive CFBundleVersion from the project setting so App Store / TestFlight uploads track a
        # single source (settings.base.CURRENT_PROJECT_VERSION below) instead of a literal here.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - bluetooth-central
        NSBluetoothAlwaysUsageDescription: "Cénit connects directly to your WHOOP strap over Bluetooth to read heart rate, R-R intervals, battery, and sensor data locally on your iPhone. Nothing leaves your device."
        NSHealthShareUsageDescription: "Cénit reads your own Apple Health data on-device to compute recovery, strain, and sleep. Nothing leaves your device."
        NSHealthUpdateUsageDescription: "Cénit writes the metrics it computes from your strap back into Apple Health, on-device and only when you allow it."
        # Debug-only URL scheme for screenshot automation (simulator navigation via xcrun simctl openurl)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - noopdev
    entitlements:
      path: StrandiOS/Resources/NOOP.entitlements
      properties:
        com.apple.developer.healthkit: true
        # NOTE: com.apple.developer.healthkit.access (Clinical/Verifiable Health
        # Records) is intentionally omitted — free "Personal Team" Apple IDs cannot
        # provision it, and NOOP never reads clinical records. Base HealthKit above
        # is enough for steps/HR/sleep. Restore the key only with a paid team.
        com.apple.security.application-groups:
          - group.com.feriracheta.noop
    settings:
      base:
        # Build number for the iOS target; threaded into Info.plist's CFBundleVersion via
        # $(CURRENT_PROJECT_VERSION). Bump on each TestFlight / App Store upload.
        CURRENT_PROJECT_VERSION: "25"
        PRODUCT_BUNDLE_IDENTIFIER: com.feriracheta.noop
        PRODUCT_NAME: NOOP
        SWIFT_MODULE_NAME: NOOP
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: WhoopProtocol
      - package: WhoopStore
      - package: StrandAnalytics
      - package: StrandImport
      - package: StrandDesign
      - target: NOOPiOSWidgets

  # ---------------------------------------------------------------------------
  # WidgetKit extension. Renders the glanceable widget (the iOS analogue of the
  # macOS menu-bar extra). Reads a tiny snapshot the app publishes into the
  # shared App Group — never the DB.
  NOOPiOSWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StrandiOSWidgets
        excludes:
          - "Info.plist"
          - "NOOPWidgets.entitlements"
      - path: StrandiOSShared
    info:
      path: StrandiOSWidgets/Info.plist
      properties:
        CFBundleDisplayName: Cénit
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: StrandiOSWidgets/NOOPWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.feriracheta.noop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.feriracheta.noop.widgets
        PRODUCT_NAME: NOOPWidgets
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: StrandDesign

  # ---------------------------------------------------------------------------
  # UI test bundle that drives NOOPiOS in the simulator and captures screenshots
  # of every screen for design review / Figma import.
  # Run: xcodebuild test -scheme NOOPiOS -destination 'platform=iOS Simulator,name=iPhone 16'
  NOOPiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - StrandiOSUITests
    dependencies:
      - target: NOOPiOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.feriracheta.noop.uitests

  # ---------------------------------------------------------------------------
  # Unit-test bundle for the iOS app target. Runs the app-layer logic tests
  # (migrated from the retired macOS StrandTests) against the NOOP module in the
  # simulator. PRODUCT_NAME is NOOP (≠ the target name), so the auto TEST_HOST is
  # wrong — set it explicitly to the iOS bundle's binary.
  NOOPiOSUnitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - StrandiOSUnitTests
    dependencies:
      - target: NOOPiOS
      - package: WhoopStore
      - package: StrandAnalytics
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.feriracheta.noop.unittests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NOOP.app/NOOP"
        BUNDLE_LOADER: "$(TEST_HOST)"

# Explicit shared schemes so `xcodebuild -scheme …` works straight after
# `xcodegen generate` — without these, schemes only exist after Xcode's GUI
# auto-creates them, which a CLI/CI build can't rely on.
schemes:
  NOOPiOS:
    build:
      targets:
        NOOPiOS: all
        NOOPiOSUITests: [testing]
        NOOPiOSUnitTests: [testing]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NOOPiOSUnitTests
        - NOOPiOSUITests
