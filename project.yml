name: Cenit
options:
  bundleIdPrefix: com.feriracheta
  createIntermediateGroups: true
  groupSortPosition: top
  # Base/development language. The in-source UI strings are authored in English (US);
  # the String Catalog (Cenit/Resources/Localizable.xcstrings) carries this as the
  # source language and is where additional languages are added.
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "1.85"
    # Single source for the build number, threaded into the app's CFBundleVersion via
    # $(CURRENT_PROJECT_VERSION). Bump it here once per TestFlight / App Store upload.
    CURRENT_PROJECT_VERSION: "25"
    SWIFT_VERSION: "5.0"
    # Auto-extraction of LocalizedStringKey into the String Catalog on build is DISABLED:
    # Xcode 26.3's extractor (IDEXCStringsSupportCore / StringTraceGraph) crashes with a
    # stack-overflow recursion on our string-construction graph, taking the whole IDE down
    # on every build. The catalog is maintained BY HAND instead — `Tools/translate-es.py` is
    # the source of truth for `es`. Do NOT trust the .stringsdata Xcode leaves in DerivedData:
    # the IDE-side parser that writes it only extracts from files containing a SwiftUI
    # `Text("…")` literal, so it reports live `String(localized:)` strings as missing.
    # NOTE this setting is compiler-side ONLY and does not stop that IDE parser — building
    # still rewrites Localizable.xcstrings destructively (marks live strings stale, drops their
    # `es` values). Discard that churn; never commit it. Root cause + measurements:
    # docs/design-system/I18N.md §2.1. Re-enable once the Xcode bug is resolved (FER-568).
    SWIFT_EMIT_LOC_STRINGS: NO
    # FER-978 (was FER-973 · A-03): the app target checks the code that OPTED INTO concurrency
    # (actors, @MainActor, Sendable) — where the app's real risk lives (HealthKit bridges,
    # Task.detached snapshots; historical BLE delegate FER-173 is gone with the band) — without
    # the full `complete` avalanche. The 112 warnings the first flip surfaced were triaged:
    # real cross-actor captures fixed, expected escapes annotated.
    SWIFT_STRICT_CONCURRENCY: targeted
    DEVELOPMENT_TEAM: "B7KRCF776Z"
    CODE_SIGN_STYLE: Automatic
    # Standard archs (arm64 on iOS device / simulator).
    ARCHS: "$(ARCHS_STANDARD)"
  configs:
    Debug:
      # Debug builds only the host's active arch — halves simulator/test compile work
      # (no second slice). Neutral for device builds, which are arm64-only anyway.
      ONLY_ACTIVE_ARCH: YES
    Release:
      # Release/archive builds every valid arch, not just the host's active one.
      ONLY_ACTIVE_ARCH: NO
packages:
  # BiometricStreams — vocabulario neutro de filas biométricas (FER-993 · D2). Raíz del grafo:
  # no depende de nadie. El app es Apple-only.
  BiometricStreams:
    path: Packages/BiometricStreams
  CenitStore:
    path: Packages/CenitStore
  StrandAnalytics:
    path: Packages/StrandAnalytics
  StrandImport:
    path: Packages/StrandImport
  CenitDesign:
    path: Packages/CenitDesign
  StrandTraining:
    path: Packages/StrandTraining
  # Inject — recarga en caliente (hot reload) para iterar la UI sin recompilar. Solo actúa en Debug,
  # con el flag `-interposable` de abajo + InjectionIII.app abierta; en Release es inerte (no-op).
  # github.com/krzysztofzablocki/Inject
  Inject:
    url: https://github.com/krzysztofzablocki/Inject.git
    from: "1.6.0"
targets:
  # ---------------------------------------------------------------------------
  # iOS app target (module/product Cenit). Reuses the shared packages and the
  # app-layer under Cenit/ (SwiftUI screens, data layer, media, onboarding);
  # the iOS app shell + HealthKit + widgets/intents live under CenitApp/.
  # Apple Health only — no BLE (FER-1003).
  Cenit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Cenit
      - path: CenitApp
        excludes:
          - "Resources/Info.plist"
          - "Resources/NOOP.entitlements"
      - path: CenitShared
      # FER-721: the ActivityKit contract + cross-process bridge are shared with the widget extension,
      # so both processes agree on the state shape. Only `Shared/` (not the widget's own views) compiles
      # into the app. FER-844: the App Intents are EXCLUDED here — the app never instantiates them (it
      # only drains their inbox), and registering the same intent id in both the app and the extension
      # let `appintentsd` resolve the lock-screen auth policy from the app-side record → Face ID. They
      # live only in the extension now.
      - path: CenitWidgets/Shared
        excludes:
          - "RestActivityIntents.swift"
    info:
      path: CenitApp/Resources/Info.plist
      properties:
        CFBundleName: Cénit
        CFBundleDisplayName: Cénit
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        # Derive CFBundleVersion from the project setting so App Store / TestFlight uploads track a
        # single source (settings.base.CURRENT_PROJECT_VERSION below) instead of a literal here.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        # Launch background = `LiquidColor.fondoAlto` (#FEFEFD), the exact TOP stop of the
        # `fondoGradient` the entrance paints, so the static pre-first-frame window hands off
        # seamlessly where the eye is looking. The gradient darkens to #F3F4F2 at the bottom, so
        # the lower edge does still shift by one faint step (~9 % of relative luminance) — a flat
        # launch screen cannot hold a gradient, so this is the closest honest match. It
        # used to be the retired «Instrumento» warm paper
        # (#F4F1E8), which flashed cream before Liquid's white took over (FER-41). The color asset
        # lives in CenitApp/Resources/Assets.xcassets/LaunchBackground.colorset.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # FER-721: required to start any Live Activity (the guided-session rest timer on the lock
        # screen + Dynamic Island). The extension that renders it is the CenitWidgets target below.
        NSSupportsLiveActivities: true
        NSHealthShareUsageDescription: "Cénit reads your own Apple Health data on-device: sleep, heart rate, heart-rate variability, workouts, and related samples, to show your days and nightly trends. Cénit never uploads it. No server, no account."
        NSHealthUpdateUsageDescription: "Cénit saves your strength workouts into Apple Health, on-device and only when you allow it."
        NSPhotoLibraryAddUsageDescription: "Cénit saves the workout card you choose to share to your photo library. It only saves the image you explicitly ask it to."
        NSCalendarsFullAccessUsageDescription: "Cénit crosses your calendar events with your day's stress, on your iPhone, to show what your most activated moments coincided with. Cénit never uploads it. No server, no account."
        NSCalendarsUsageDescription: "Cénit crosses your calendar events with your day's stress, on your iPhone, to show what your most activated moments coincided with. Cénit never uploads it. No server, no account."
        # Debug-only URL scheme for screenshot automation (simulator navigation via xcrun simctl openurl)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - noopdev
    entitlements:
      path: CenitApp/Resources/NOOP.entitlements
      properties:
        com.apple.developer.healthkit: true
        # NOTE: com.apple.developer.healthkit.access (Clinical/Verifiable Health
        # Records) is intentionally omitted — free "Personal Team" Apple IDs cannot
        # provision it, and NOOP never reads clinical records. Base HealthKit above
        # is enough for steps/HR/sleep. Restore the key only with a paid team.
        com.apple.security.application-groups:
          - group.com.feriracheta.cenit
    settings:
      configFiles:
        Debug: Cenit/Config.xcconfig
        Release: Cenit/Config.xcconfig
      base:
        # CURRENT_PROJECT_VERSION / MARKETING_VERSION are inherited from settings.base above.
        PRODUCT_BUNDLE_IDENTIFIER: com.feriracheta.cenit
        PRODUCT_NAME: Cenit
        SWIFT_MODULE_NAME: Cenit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        # See note on the base setting: disabled to avoid the Xcode 26.3 extractor crash.
        SWIFT_EMIT_LOC_STRINGS: NO
      configs:
        Debug:
          # Inject/InjectionIII: permite intercambiar el código en caliente (solo Debug). `$(inherited)`
          # conserva cualquier otro flag. Este bloque NO aplica en Release → el build de tienda queda intacto.
          OTHER_LDFLAGS: -Xlinker -interposable $(inherited)
          # FER-981: instrumentación de type-check. El compilador avisa de cada función/expresión que
          # tarda más del umbral (ms) en type-checkear, con archivo:línea — la lista MEDIDA (no adivinada)
          # de qué `body` partir. Va aquí (settings del target) y NO en `Cenit/Config.xcconfig`: los
          # settings de target que escribe xcodegen PISAN el xcconfig, por eso ahí no aplicaba (Ola A).
          # Solo Debug: el build de tienda no paga ni ruido ni tiempo extra.
          OTHER_SWIFT_FLAGS: $(inherited) -Xfrontend -warn-long-function-bodies=100 -Xfrontend -warn-long-expression-type-checking=100
          # Xcode 16.3+ dejó de anotar en el build log el comando con que compila cada archivo, y sin eso
          # InjectionIII no puede recompilar en caliente («Could not locate compile command»). Esto lo
          # re-activa (solo Debug). Requiere UN rebuild para que el log se regenere.
          EMIT_FRONTEND_COMMAND_LINES: YES
    dependencies:
      - package: BiometricStreams
      - package: CenitStore
      - package: StrandAnalytics
      - package: StrandImport
      - package: CenitDesign
      - package: StrandTraining
      # Inject: recarga en caliente en Debug (dev-only, inerte en Release).
      - package: Inject
      # FER-721: embed the Live Activity / widget extension into the app bundle.
      - target: CenitWidgets
      # FER-740: embed the watchOS companion app so it installs with the iPhone app.
      - target: CenitWatch
        embed: true

  # ---------------------------------------------------------------------------
  # FER-740: the watchOS companion (single-target watchOS 10 app). Runs the real HKWorkoutSession for a
  # guided strength session and mirrors it to the iPhone; no GRDB on the wrist. Depends only on
  # CenitDesign (paints) plus the shared mirroring contract in CenitShared. Only builds/signs on a
  # physical Apple Watch (personal team).
  CenitWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: CenitWatch
      # The workout-mirroring contract (WorkoutMirrorMessage, RestActivitySnapshot) + App-Group plumbing,
      # shared verbatim with the iPhone app so both processes agree on the wire shape.
      - path: CenitShared
    info:
      path: CenitWatch/Resources/Info.plist
      properties:
        CFBundleDisplayName: Cénit
        CFBundleName: Cénit
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Marks this as a single-target watchOS app and links it to the iPhone app.
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.feriracheta.cenit
        WKRunsIndependentlyOfCompanionApp: true   # C1 (FER-361): the watch can start/log a session standalone
        # Required by watchOS for ANY HKWorkoutSession (incl. the mirrored strength session
        # of FER-391 F1). Without it startMirroringToCompanionDevice() fails and the iPhone
        # times out to «El reloj no respondió». Matches Apple's multidevice-workout sample.
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: "Cénit lee tu frecuencia cardiaca en el reloj durante la sesión de fuerza para grabar el entrenamiento. Cénit nunca lo sube. Sin servidor ni cuenta."
        NSHealthUpdateUsageDescription: "Cénit guarda tu sesión de fuerza como entrenamiento en Apple Salud, en el dispositivo y solo cuando tú lo permites."
    entitlements:
      path: CenitWatch/Resources/CenitWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.feriracheta.cenit.watchkitapp
        PRODUCT_NAME: Cenit
        SWIFT_MODULE_NAME: CenitWatch
        DEVELOPMENT_TEAM: "B7KRCF776Z"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_EMIT_LOC_STRINGS: NO
    dependencies:
      - package: CenitDesign
      - package: StrandTraining   # C1 (FER-361): the wire + the on-wrist logger use the real domain types

  # ---------------------------------------------------------------------------
  # FER-721: the app's first app-extension target — a WidgetKit extension that hosts the guided
  # session's rest Live Activity (lock screen + Dynamic Island). Shares the App Group with the app for
  # the «+30 s»/«Saltar» action inbox. Only builds/signs on a physical iPhone (personal team).
  CenitWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CenitWidgets
        excludes:
          - "Resources/Info.plist"
          - "Resources/CenitWidgets.entitlements"
      # The App-Group suite name is declared ONCE in CenitShared/AppGroup.swift; `RestActivityBridge`
      # reads it from there instead of repeating the literal (the two drifted apart before). Only this
      # file is pulled in — the rest of CenitShared (watch mirroring) has no business in the widget.
      - path: CenitShared/AppGroup.swift
    info:
      path: CenitWidgets/Resources/Info.plist
      properties:
        CFBundleDisplayName: Cénit
        CFBundleName: CenitWidgets
        # Match the host app's version — an embedded extension must, or App Store upload rejects it.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: CenitWidgets/Resources/CenitWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.feriracheta.cenit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.feriracheta.cenit.CenitWidgets
        PRODUCT_NAME: CenitWidgets
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: NO
        SKIP_INSTALL: YES
    dependencies:
      - package: CenitDesign

  # ---------------------------------------------------------------------------
  # UI test bundle that drives the Cenit app in the simulator and captures
  # screenshots of every screen for design review / Figma import.
  # Run: xcodebuild test -scheme Cenit -destination 'platform=iOS Simulator,name=iPhone 16'
  CenitUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - CenitUITests
    dependencies:
      - target: Cenit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.feriracheta.cenit.uitests

  # ---------------------------------------------------------------------------
  # Unit-test bundle for the iOS app target. Runs the app-layer logic tests
  # (migrated from the retired macOS StrandTests) against the Cenit module in the
  # simulator. TEST_HOST points at the iOS bundle's binary explicitly.
  CenitUnitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - CenitUnitTests
    dependencies:
      - target: Cenit
      # Los paquetes van .static (fix del canvas): el bundle de tests compila
      # contra los modulos pero NO linkea su copia — los simbolos los da el
      # host (Cenit.app), si no Xcode truena por duplicacion de codigo.
      - package: BiometricStreams
        link: false
      - package: CenitStore
        link: false
      - package: StrandAnalytics
        link: false
      - package: StrandTraining
        link: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.feriracheta.cenit.unittests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Cenit.app/Cenit"
        BUNDLE_LOADER: "$(TEST_HOST)"

# Explicit shared schemes so `xcodebuild -scheme …` works straight after
# `xcodegen generate` — without these, schemes only exist after Xcode's GUI
# auto-creates them, which a CLI/CI build can't rely on.
schemes:
  # FER-740: a standalone scheme for the watchOS companion so it can be built directly against the
  # watchOS SDK (`xcodebuild -scheme CenitWatch -destination 'generic/platform=watchOS'`) without a
  # paired watchOS Simulator runtime.
  CenitWatch:
    build:
      targets:
        CenitWatch: all
    run:
      config: Debug
  Cenit:
    build:
      targets:
        Cenit: all
        CenitWidgets: all
        CenitWatch: all
        CenitUITests: [testing]
        CenitUnitTests: [testing]
    run:
      config: Debug
      # Inject/InjectionNext: sin esto, la recarga en caliente SOLO reacciona a un ⌘S hecho dentro del
      # editor de Xcode (la detecta interceptando los logs de SourceKit). Con este env var el bundle de
      # inyección levanta su propio file-watcher sobre $(SRCROOT), así que también entran en caliente las
      # ediciones hechas desde fuera de Xcode — un agente, vim, lo que sea. Solo afecta al esquema de Run.
      environmentVariables:
        INJECTION_PROJECT_ROOT: $(SRCROOT)
    test:
      config: Debug
      targets:
        - CenitUnitTests
        - CenitUITests
