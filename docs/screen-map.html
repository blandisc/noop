<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>NOOP iOS · Mapa de Pantallas</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d0d0d;
  --surface: #161616;
  --surface2: #1e1e1e;
  --border: #272727;
  --border2: #333;
  --text: #e8e8e8;
  --muted: #555;
  --muted2: #3a3a3a;
  --accent: #18C98B;
  --warn: #F5A623;
  --info: #4A9EFF;
  --err: #FF5A5A;
  --purple: #9B8FFF;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  overflow: hidden;
  height: 100vh;
  user-select: none;
  -webkit-user-select: none;
}

/* ── Toolbar ── */
#toolbar {
  position: fixed;
  top: 0; left: 0; right: 0; height: 44px;
  background: rgba(13,13,13,0.94);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 16px; gap: 10px; z-index: 200;
}

#toolbar h1 {
  font-size: 13px; font-weight: 600;
  letter-spacing: -0.3px; color: var(--text);
  white-space: nowrap;
}

.chip {
  font-size: 10px; font-weight: 500;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2px 8px;
  color: var(--muted);
  white-space: nowrap;
}

.sep { flex: 1; }

.legend { display: flex; gap: 12px; align-items: center; }
.leg { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--muted); white-space: nowrap; }
.leg-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

.tb-updated { font-size: 10px; color: var(--muted2); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ── Wrapper ── */
#wrapper {
  position: fixed;
  inset: 44px 0 0 0;
  overflow: hidden;
  cursor: grab;
}
#wrapper.dragging { cursor: grabbing; }

/* ── Canvas ── */
#canvas {
  position: absolute;
  width: 1320px;
  height: 4000px;
  transform-origin: 0 0;
  background-image: radial-gradient(circle, #1b1b1b 1.1px, transparent 1.1px);
  background-size: 26px 26px;
}

/* Section labels (Figma-style group header) */
.sec-label {
  position: absolute;
  font-size: 12px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  color: #6e6e6e;
  pointer-events: none;
  display: flex; align-items: center; gap: 9px;
}
.sec-label::before {
  content: ''; width: 14px; height: 2px; border-radius: 2px;
  background: var(--accent);
}

/* ── Node = device frame + caption label (Figma-style) ── */
.node {
  position: absolute;
  width: 212px;
  cursor: pointer;
  z-index: 2;
}

/* the phone frame — lifts the screen off the dark canvas */
.frame {
  position: relative;
  width: 212px;
  padding: 6px;
  background: #050505;
  border: 1px solid #353535;
  border-radius: 28px;
  box-shadow: 0 12px 34px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.5);
  transition: border-color .12s, box-shadow .12s, transform .12s;
}
.frame::after {  /* notch */
  content: ''; position: absolute; top: 6px; left: 50%;
  transform: translateX(-50%);
  width: 66px; height: 16px; background: #050505;
  border-radius: 0 0 11px 11px; z-index: 3;
}
.node:hover .frame {
  border-color: var(--accent);
  box-shadow: 0 16px 42px rgba(0,0,0,0.62), 0 0 0 1px var(--accent);
  transform: translateY(-3px);
}
.node.selected .frame {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent), 0 16px 46px rgba(24,201,139,0.28);
}
.node.sheet .frame { border-style: dashed; border-color: #4a4a4a; }

.frame-screen {
  width: 100%; aspect-ratio: 393 / 852;
  border-radius: 22px; overflow: hidden;
  background: #111; display: block;
}
.frame-screen img {
  width: 100%; height: 100%;
  object-fit: cover; object-position: top center;
  display: block; opacity: 0; transition: opacity .25s;
}
.frame-screen img.loaded { opacity: 1; }
.frame-screen.no-img { display: flex; align-items: center; justify-content: center; }
.frame-screen.no-img::after { content: 'sin fixture'; font-size: 10px; color: var(--muted2); }

/* caption below the frame — the readable frame label */
.cap { padding: 12px 2px 0; }
.cap-row { display: flex; align-items: center; gap: 8px; }
.cap-icon {
  width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 12px;
}
.cap-name { font-size: 14px; font-weight: 650; color: var(--text); letter-spacing: -0.2px; }
.cap-tag {
  font-size: 8px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
  color: #8a8a8a; border: 1px solid #3a3a3a; border-radius: 4px;
  padding: 1px 4px; margin-left: auto;
}
.cap-desc { font-size: 10.5px; color: var(--muted); margin-top: 4px; line-height: 1.35; padding-left: 30px; }
.cap-dots { display: flex; gap: 4px; align-items: center; margin-top: 8px; padding-left: 30px; }
.cap-dot { width: 7px; height: 7px; border-radius: 50%; }
.cap-dots .cap-n { font-size: 9.5px; color: var(--muted2); margin-left: 3px; font-variant-numeric: tabular-nums; }

.states { display: flex; flex-wrap: wrap; gap: 4px; }

.sc {
  font-size: 9.5px; line-height: 1.5;
  padding: 1.5px 6px;
  border-radius: 8px;
  border: 1px solid;
}
.sc.empty   { color: #484848; border-color: #242424; background: #131313; }
.sc.loading { color: #444;    border-color: #202020; background: #111;    }
.sc.data    { color: var(--info);   border-color: #152540; background: #0a1525; }
.sc.live    { color: var(--accent); border-color: #0c2e1c; background: #060f0a; }
.sc.warn    { color: var(--warn);   border-color: #312208; background: #180f04; }
.sc.err     { color: var(--err);    border-color: #351414; background: #180808; }

/* ── SVG arrows (flows) ── */
#arrows {
  position: absolute;
  inset: 0;
  width: 1320px;
  height: 4000px;
  pointer-events: none;
  overflow: visible;
  z-index: 3;   /* above frames so connectors read clearly */
}
.edge-label {
  position: absolute;
  transform: translate(-50%, -50%);
  font-size: 10px; font-weight: 650; white-space: nowrap;
  padding: 3px 9px; border-radius: 20px;
  background: #0c0c0c; border: 1px solid;
  z-index: 6; pointer-events: none;
  letter-spacing: .2px;
}

/* ── Detail panel ── */
#panel {
  position: fixed;
  right: 0; top: 44px; bottom: 0; width: 300px;
  background: rgba(13,13,13,0.97);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-left: 1px solid var(--border);
  padding: 20px 20px 40px;
  overflow-y: auto;
  transform: translateX(100%);
  transition: transform 0.18s ease;
  z-index: 150;
}
#panel.open { transform: translateX(0); }

#panel-close {
  position: absolute; top: 14px; right: 14px;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--muted); border-radius: 6px;
  width: 24px; height: 24px; cursor: pointer; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
}
#panel-close:hover { color: var(--text); border-color: var(--border2); }

/* ── Panel fixture preview ── */
.p-fixture {
  margin-bottom: 18px;
  border-radius: 8px;
  overflow: hidden;
  background: #0a0a0a;
  border: 1px solid var(--border);
}
.p-fixture img {
  width: 100%;
  display: block; /* no max-height — full screenshot */
}

.p-title { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
.p-file  {
  font-size: 10px; color: var(--muted);
  font-family: 'SF Mono', ui-monospace, monospace;
  margin-bottom: 18px; line-height: 1.5;
  word-break: break-all;
}

.p-sec { margin-bottom: 18px; }
.p-sec h3 {
  font-size: 9px; font-weight: 700;
  letter-spacing: 1.2px; text-transform: uppercase;
  color: var(--muted); margin-bottom: 8px;
}
.p-sec ul { list-style: none; display: flex; flex-direction: column; gap: 5px; }
.p-sec ul li {
  font-size: 11px; color: var(--text);
  display: flex; gap: 8px; align-items: baseline; line-height: 1.4;
}
.p-sec ul li::before { content: '·'; color: var(--muted2); flex-shrink: 0; }
.nav-type {
  font-size: 9px; color: var(--muted);
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 4px; padding: 1px 5px; flex-shrink: 0;
}

/* ── Zoom controls ── */
#zoom-bar {
  position: fixed;
  bottom: 16px; right: 16px;
  display: flex; gap: 4px; z-index: 200;
  align-items: center;
}
#zoom-bar button {
  width: 30px; height: 30px;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); border-radius: 7px; cursor: pointer;
  font-size: 15px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.1s;
}
#zoom-bar button:hover { background: var(--border); }
#zoom-pct {
  font-size: 10px; color: var(--muted);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 7px; padding: 0 8px; height: 30px;
  display: flex; align-items: center;
  font-variant-numeric: tabular-nums; min-width: 44px;
  justify-content: center;
}

/* ── Hint ── */
#hint {
  position: fixed; bottom: 16px; left: 50%;
  transform: translateX(-50%);
  font-size: 10px; color: var(--muted2);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 5px 12px;
  pointer-events: none; z-index: 200;
  transition: opacity 0.5s;
}
</style>
</head>

const secYs = SECTIONS.map(s => s.y);
function rowOf(y) { let r = 0; for (const sy of secYs) if (y >= sy) r++; return r - 1; }

// ─── Flows (orthogonal connectors routed through gutters) ───
const EDGE_COLORS = {
  fullscreen: '#18C98B',
  sheet:      '#4A9EFF',
  push:       '#9B8FFF',
  toolbar:    '#FF5A5A',
};
const GAPX = STEPX - OUTER_W;                       // horizontal gutter width
const colCenter   = c => MX + c * STEPX + OUTER_W / 2;
const gutterLeft  = c => MX + c * STEPX - GAPX / 2; // vertical channel left of a column

// Build an orthogonal path with rounded corners through a list of points
function roundedPath(pts, r) {
  pts = pts.filter((p, i) => i === 0 || p[0] !== pts[i - 1][0] || p[1] !== pts[i - 1][1]);
  if (pts.length < 2) return '';
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
    const len1 = Math.hypot(x1 - x0, y1 - y0), len2 = Math.hypot(x2 - x1, y2 - y1);
    const rr = Math.min(r, len1 / 2, len2 / 2);
    const v1x = Math.sign(x1 - x0), v1y = Math.sign(y1 - y0);
    const v2x = Math.sign(x2 - x1), v2y = Math.sign(y2 - y1);
    d += ` L${x1 - v1x * rr},${y1 - v1y * rr} Q${x1},${y1} ${x1 + v2x * rr},${y1 + v2y * rr}`;
  }
  const last = pts[pts.length - 1];
  d += ` L${last[0]},${last[1]}`;
  return d;
}

function renderArrows() {
  // clear previous labels
  document.querySelectorAll('.edge-label').forEach(n => n.remove());
  arrowSvg.innerHTML = `<defs>
    ${Object.entries(EDGE_COLORS).map(([k, c]) => `
      <marker id="arr-${k}" viewBox="0 0 10 10" refX="8" refY="5"
        markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0,1 L9,5 L0,9 Z" fill="${c}"/>
      </marker>`).join('')}
  </defs>`;

  // count out-edges per source so we can spread their exit points
  const outTotal = {}, outSeen = {};
  EDGES.forEach(e => outTotal[e.from] = (outTotal[e.from] || 0) + 1);

  EDGES.forEach(edge => {
    const from = byId[edge.from], to = byId[edge.to];
    if (!from || !to) return;

    const fromEl = document.getElementById('node-' + edge.from);
    const h = fromEl ? fromEl.offsetHeight : 560;

    const N = outTotal[edge.from];
    const i = (outSeen[edge.from] = (outSeen[edge.from] || 0)) , _ = (outSeen[edge.from]++);
    const spread = N === 1 ? 0.5 : 0.28 + 0.44 * (i / (N - 1));

    const sxc = from.X + OUTER_W * spread;   // exit x along source bottom
    const sB  = from.Y + h;                  // source bottom
    const txc = colCenter(to._col);
    const tT  = to.Y - 6;                     // target top (frame)

    const ya  = sB + 34 + i * 14;             // channel just below source
    const yb  = tT - 46;                      // channel just above target
    const xg  = gutterLeft(to._col);          // vertical channel near target

    const pts = [[sxc, sB], [sxc, ya], [xg, ya], [xg, yb], [txc, yb], [txc, tT]];
    const color = EDGE_COLORS[edge.type] || '#888';

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', roundedPath(pts, 14));
    path.setAttribute('stroke', color);
    path.setAttribute('stroke-width', '2.5');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('marker-end', `url(#arr-${edge.type})`);
    arrowSvg.appendChild(path);

    // label pill placed on the long vertical channel segment
    const lbl = document.createElement('div');
    lbl.className = 'edge-label';
    lbl.textContent = edge.label;
    lbl.style.left = xg + 'px';
    lbl.style.top  = ((ya + yb) / 2) + 'px';
    lbl.style.color = color;
    lbl.style.borderColor = color + '66';
    canvas.appendChild(lbl);
  });
}

// Delay so frames settle their layout before measuring offsetHeight

function openPanel(s) {
  document.querySelectorAll('.node').forEach(n => n.classList.remove('selected'));
  document.getElementById('node-' + s.id).classList.add('selected');

  const navHtml = s.nav.length ? `
    <div class="p-sec">
      <h3>Navegación saliente</h3>
      <ul>${s.nav.map(n =>
        `<li>${n.label} <span class="nav-type">${n.type}</span></li>`
      ).join('')}</ul>
    </div>` : '';

  const compHtml = s.components.length ? `
    <div class="p-sec">
      <h3>Componentes clave</h3>
      <ul>${s.components.map(c => `<li>${c}</li>`).join('')}</ul>
    </div>` : '';

  // Full screenshot — stack all scroll frames so the whole screen is visible here
  const frames = s.scrollFrames || [s.id];
  const fixtureHtml = `
    <div class="p-fixture">
      ${frames.map(f => `<img src="fixtures/${f}.png" alt="${s.name}"
           onerror="this.remove()">`).join('')}
    </div>`;

  document.getElementById('panel-content').innerHTML = `
    ${fixtureHtml}
    <div class="p-title">${s.icon} ${s.name}</div>
    <div class="p-file">${s.file}</div>

    <div class="p-sec">
      <h3>Estados visuales</h3>
      <div class="states" style="display:flex;flex-wrap:wrap;gap:5px">
        ${s.states.map(st => `<span class="sc ${st.type}">${st.label}</span>`).join('')}
      </div>
    </div>

    ${navHtml}
    ${compHtml}
  `;

  document.getElementById('panel').classList.add('open');

  // Bring the node toward the centre of the visible area (left of the panel)
  const rect = document.getElementById('wrapper').getBoundingClientRect();
  offsetX = (rect.width - 300) / 2 - (s.X + OUTER_W / 2) * scale;
  offsetY = rect.height / 2 - (s.Y + 200) * scale;
  applyTransform();
}

function closePanel() {
  document.querySelectorAll('.node').forEach(n => n.classList.remove('selected'));
  document.getElementById('panel').classList.remove('open');
}

document.getElementById('wrapper').addEventListener('click', e => {
  if (!e.target.closest('.node') && !e.target.closest('#panel')) closePanel();
});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  PAN & ZOOM
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let scale = 0.64, offsetX = 50, offsetY = 16;
let dragging = false, sx, sy, sox, soy;

const wrapper = document.getElementById('wrapper');

function applyTransform() {
  canvas.style.transform = `translate(${offsetX}px,${offsetY}px) scale(${scale})`;
  canvas.style.transformOrigin = '0 0';
  document.getElementById('zoom-pct').textContent = Math.round(scale * 100) + '%';
}
applyTransform();

wrapper.addEventListener('mousedown', e => {
  if (e.target.closest('.node') || e.target.closest('#panel')) return;
  dragging = true;
  wrapper.classList.add('dragging');
  sx = e.clientX; sy = e.clientY; sox = offsetX; soy = offsetY;
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  offsetX = sox + (e.clientX - sx);
  offsetY = soy + (e.clientY - sy);
  applyTransform();
});
window.addEventListener('mouseup', () => {
  dragging = false;
  wrapper.classList.remove('dragging');
});

wrapper.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const rect = wrapper.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const wx = (mx - offsetX) / scale;
  const wy = (my - offsetY) / scale;
  scale = Math.max(0.2, Math.min(2.5, scale * delta));
  offsetX = mx - wx * scale;
  offsetY = my - wy * scale;
  applyTransform();
}, { passive: false });

function doZoom(f) {
  const rect = wrapper.getBoundingClientRect();
  const cx = rect.width / 2, cy = rect.height / 2;
  const wx = (cx - offsetX) / scale;
  const wy = (cy - offsetY) / scale;
  scale = Math.max(0.2, Math.min(2.5, scale * f));
  offsetX = cx - wx * scale;
  offsetY = cy - wy * scale;
  applyTransform();
}

function resetView() {
  scale = 0.64; offsetX = 50; offsetY = 16;
  applyTransform();
  closePanel();
}

// Hide hint after 4 s
setTimeout(() => {
  const h = document.getElementById('hint');
  h.style.opacity = '0';
  setTimeout(() => h.remove(), 500);
}, 4000);
</script>
</body>
</html>
